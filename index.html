t:800;font-size:15px;cursor:pointer}.btn.secondary{background:#e8edfa;color:#213d84}.btn:disabled{opacity:.45;cursor:not-allowed}.score{font-size:30px;font-weight:900;color:#233f91;margin:10px 0}.hidden{display:none!important}footer{text-align:center;color:#8791a6;font-size:13px;padding-top:20px}@media(max-width:550px){.options{grid-template-columns:1fr}.panel{padding:16px}.question{padding:15px}.han{font-size:30px}}

<header><div class="brand">합격킹 HSK</div><div style="margin-top:7px;font-weight:700">화선쌤 속사포 0-3급</div><h1>이합동사 및 특수동사</h1><p>한자를 눌러 발음을 듣고 알맞은 뜻을 골라보세요!</p></header>
<main class="wrap">
<section class="panel"><div class="bar"><span id="mode" class="tag">전체 어휘 테스트</span><span class="muted" id="count"></span></div><div class="progress"><div id="fill" style="width:0"></div></div><p class="muted">총 46문제 · 이합동사 28개 · 수여동사 8개 · 문장을 목적어로 취하는 동사 10개. 선택지는 같은 유형의 뜻으로만 출제됩니다. 병음은 채점 후 틀린 문제에만 표시됩니다.</p><div class="btns"><button class="btn secondary" id="previous">이전 결과 다시 보기</button><button class="btn secondary" id="retry">틀린 문제 다시 풀기</button><button class="btn secondary" id="restart">처음부터 다시 풀기</button></div></section>
<section class="panel hidden" id="summary"></section><section id="questions"></section>
<div class="panel" id="submitbox"><button class="btn" id="grade" style="width:100%">채점하기</button><p class="muted" style="text-align:center;margin-bottom:0">선택하지 않은 문제는 오답 처리됩니다.</p></div>
<footer>합격킹 HSK · 화선쌤 속사포 0-3급</footer></main>
<script>
const DATA=[{"id": "q0", "han": "睡觉", "pinyin": "shuìjiào", "meaning": "잠을 자다", "group": "이합동사", "speak": "睡觉"}, {"id": "q1", "han": "起床", "pinyin": "qǐchuáng", "meaning": "일어나다, 기상하다", "group": "이합동사", "speak": "起床"}, {"id": "q2", "han": "见面", "pinyin": "jiànmiàn", "meaning": "만나다", "group": "이합동사", "speak": "见面"}, {"id": "q3", "han": "帮忙", "pinyin": "bāngmáng", "meaning": "돕다", "group": "이합동사", "speak": "帮忙"}, {"id": "q4", "han": "洗澡", "pinyin": "xǐzǎo", "meaning": "목욕하다", "group": "이합동사", "speak": "洗澡"}, {"id": "q5", "han": "留学", "pinyin": "liúxué", "meaning": "유학하다", "group": "이합동사", "speak": "留学"}, {"id": "q6", "han": "上学", "pinyin": "shàngxué", "meaning": "학교에 다니다 / 등교하다", "group": "이합동사", "speak": "上学"}, {"id": "q7", "han": "毕业", "pinyin": "bìyè", "meaning": "졸업하다", "group": "이합동사", "speak": "毕业"}, {"id": "q8", "han": "搬家", "pinyin": "bānjiā", "meaning": "이사하다", "group": "이합동사", "speak": "搬家"}, {"id": "q9", "han": "唱歌", "pinyin": "chànggē", "meaning": "노래를 부르다", "group": "이합동사", "speak": "唱歌"}, {"id": "q10", "han": "跳舞", "pinyin": "tiàowǔ", "meaning": "춤을 추다", "group": "이합동사", "speak": "跳舞"}, {"id": "q11", "han": "画画(儿)", "pinyin": "huàhuà(r)", "meaning": "그림을 그리다", "group": "이합동사", "speak": "画画"}, {"id": "q12", "han": "聊天(儿)", "pinyin": "liáotiān(r)", "meaning": "수다를 떨다, 이야기를 나누다", "group": "이합동사", "speak": "聊天"}, {"id": "q13", "han": "放假", "pinyin": "fàngjià", "meaning": "방학하다, 휴가로 쉬다", "group": "이합동사", "speak": "放假"}, {"id": "q14", "han": "请假", "pinyin": "qǐngjià", "meaning": "휴가를 신청하다", "group": "이합동사", "speak": "请假"}, {"id": "q15", "han": "结婚", "pinyin": "jiéhūn", "meaning": "결혼하다", "group": "이합동사", "speak": "结婚"}, {"id": "q16", "han": "散步", "pinyin": "sànbù", "meaning": "산책하다", "group": "이합동사", "speak": "散步"}, {"id": "q17", "han": "跑步", "pinyin": "pǎobù", "meaning": "달리기 하다", "group": "이합동사", "speak": "跑步"}, {"id": "q18", "han": "爬山", "pinyin": "páshān", "meaning": "등산하다", "group": "이합동사", "speak": "爬山"}, {"id": "q19", "han": "发烧", "pinyin": "fāshāo", "meaning": "열이 나다", "group": "이합동사", "speak": "发烧"}, {"id": "q20", "han": "生病", "pinyin": "shēngbìng", "meaning": "병이 나다", "group": "이합동사", "speak": "生病"}, {"id": "q21", "han": "生气", "pinyin": "shēngqì", "meaning": "화가 나다, 화를 내다", "group": "이합동사", "speak": "生气"}, {"id": "q22", "han": "下雨", "pinyin": "xiàyǔ", "meaning": "비가 내리다", "group": "이합동사", "speak": "下雨"}, {"id": "q23", "han": "下雪", "pinyin": "xiàxuě", "meaning": "눈이 내리다", "group": "이합동사", "speak": "下雪"}, {"id": "q24", "han": "游泳", "pinyin": "yóuyǒng", "meaning": "수영을 하다", "group": "이합동사", "speak": "游泳"}, {"id": "q25", "han": "旅游", "pinyin": "lǚyóu", "meaning": "여행을 하다", "group": "이합동사", "speak": "旅游"}, {"id": "q26", "han": "出差", "pinyin": "chūchāi", "meaning": "출장을 가다", "group": "이합동사", "speak": "出差"}, {"id": "q27", "han": "照相", "pinyin": "zhàoxiàng", "meaning": "사진을 찍다", "group": "이합동사", "speak": "照相"}, {"id": "q28", "han": "给", "pinyin": "gěi", "meaning": "~에게 ~을 주다", "group": "수여동사", "speak": "给"}, {"id": "q29", "han": "叫", "pinyin": "jiào", "meaning": "~를 ~라고 부르다", "group": "수여동사", "speak": "叫"}, {"id": "q30", "han": "送", "pinyin": "sòng", "meaning": "~에게 ~을 보내다", "group": "수여동사", "speak": "送"}, {"id": "q31", "han": "借", "pinyin": "jiè", "meaning": "~에게 ~을 빌려주다", "group": "수여동사", "speak": "借"}, {"id": "q32", "han": "问", "pinyin": "wèn", "meaning": "~에게 ~을 묻다", "group": "수여동사", "speak": "问"}, {"id": "q33", "han": "还", "pinyin": "huán", "meaning": "~에게 ~을 돌려주다", "group": "수여동사", "speak": "还"}, {"id": "q34", "han": "教", "pinyin": "jiāo", "meaning": "~에게 ~을 가르치다", "group": "수여동사", "speak": "教"}, {"id": "q35", "han": "告诉", "pinyin": "gàosu", "meaning": "~에게 ~을 알려주다", "group": "수여동사", "speak": "告诉"}, {"id": "q36", "han": "喜欢", "pinyin": "xǐhuan", "meaning": "~하는 걸 좋아하다", "group": "문장을 목적어로 취하는 동사", "speak": "喜欢"}, {"id": "q37", "han": "知道", "pinyin": "zhīdào", "meaning": "알다", "group": "문장을 목적어로 취하는 동사", "speak": "知道"}, {"id": "q38", "han": "希望", "pinyin": "xīwàng", "meaning": "~하기를 희망하다", "group": "문장을 목적어로 취하는 동사", "speak": "希望"}, {"id": "q39", "han": "觉得", "pinyin": "juéde", "meaning": "~라고 생각하다", "group": "문장을 목적어로 취하는 동사", "speak": "觉得"}, {"id": "q40", "han": "愿意", "pinyin": "yuànyì", "meaning": "~하기를 바라다", "group": "문장을 목적어로 취하는 동사", "speak": "愿意"}, {"id": "q41", "han": "以为", "pinyin": "yǐwéi", "meaning": "~라고 여기다", "group": "문장을 목적어로 취하는 동사", "speak": "以为"}, {"id": "q42", "han": "开始", "pinyin": "kāishǐ", "meaning": "~하는 걸 시작하다", "group": "문장을 목적어로 취하는 동사", "speak": "开始"}, {"id": "q43", "han": "决定", "pinyin": "juédìng", "meaning": "~하기로 결정하다", "group": "문장을 목적어로 취하는 동사", "speak": "决定"}, {"id": "q44", "han": "准备", "pinyin": "zhǔnbèi", "meaning": "~하는 걸 준비하다", "group": "문장을 목적어로 취하는 동사", "speak": "准备"}, {"id": "q45", "han": "打算", "pinyin": "dǎsuàn", "meaning": "~할 계획이다", "group": "문장을 목적어로 취하는 동사", "speak": "打算"}];
const STORE='hsk_special_verbs_last_v1';
const byId=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let questions=[],answers={},graded=false,wrong=[],mode='전체 어휘 테스트';
function speak(word){if(!('speechSynthesis'in window)){alert('이 브라우저에서는 음성 읽기를 지원하지 않습니다.');return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang='zh-CN';u.rate=.78;const voices=speechSynthesis.getVoices();let v=voices.find(v=>v.lang.toLowerCase().startsWith('zh-cn'))||voices.find(v=>v.lang.toLowerCase().startsWith('zh'));if(v)u.voice=v;speechSynthesis.speak(u)}
function choiceList(q){let pool=DATA.filter(x=>x.group===q.group&&x.meaning!==q.meaning);let distinct=[...new Set(pool.map(x=>x.meaning))];return shuffle([q.meaning,...shuffle(distinct).slice(0,3)])}
function start(items=DATA,label='전체 어휘 테스트'){questions=shuffle(items).map(q=>({...q,choices:choiceList(q)}));answers={};graded=false;wrong=[];mode=label;render();window.scrollTo(0,0)}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){byId('mode').textContent=mode;byId('summary').classList.add('hidden');byId('submitbox').classList.remove('hidden');byId('grade').disabled=false;const root=byId('questions');root.innerHTML='';questions.forEach((q,i)=>{const el=document.createElement('article');el.className='panel question';let opts=q.choices.map((c,j)=>`<button class="opt" data-choice="${j}" type="button">${escapeHTML(c)}</button>`).join('');el.innerHTML=`<div class="qhead"><span class="tag">${escapeHTML(q.group)} · ${i+1}번</span><span class="muted">🔊 한자 클릭</span></div><button class="han" type="button" title="중국어 발음 듣기">${escapeHTML(q.han)}</button><div class="options">${opts}</div><div class="feedback hidden"></div>`;el.querySelector('.han').addEventListener('click',()=>speak(q.speak));el.querySelectorAll('.opt').forEach((b,j)=>b.addEventListener('click',()=>{if(graded)return;answers[q.id]=q.choices[j];el.querySelectorAll('.opt').forEach(n=>n.classList.remove('selected'));b.classList.add('selected');updateProgress()}));root.appendChild(el)});updateProgress();byId('previous').disabled=!getRecord();byId('retry').disabled=true}
function updateProgress(){let n=questions.filter(q=>answers[q.id]!==undefined).length;byId('count').textContent=`${n} / ${questions.length}문제 선택`;byId('fill').style.width=`${questions.length?100*n/questions.length:0}%`}
function getRecord(){try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){return null}}
function showGrading(){wrong=[];questions.forEach((q,i)=>{let correct=answers[q.id]===q.meaning;if(!correct)wrong.push(q.id);let el=byId('questions').children[i];el.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.choices[j]===q.meaning)b.classList.add('correct');if(q.choices[j]===answers[q.id]&&!correct)b.classList.add('wrong')});if(!correct){let f=el.querySelector('.feedback');f.classList.remove('hidden');f.innerHTML=`<strong>오답 · 정답 확인</strong><div>병음: ${escapeHTML(q.pinyin)}</div><div>뜻: ${escapeHTML(q.meaning)}</div>`}});byId('grade').disabled=true;byId('retry').disabled=wrong.length===0;showSummary()}
function grade(){if(graded)return;graded=true;showGrading();try{localStorage.setItem(STORE,JSON.stringify({ids:questions.map(q=>q.id),choices:questions.map(q=>q.choices),answers:{...answers},mode,at:new Date().toLocaleString('ko-KR')}))}catch(e){}byId('previous').disabled=false;window.scrollTo({top:0,behavior:'smooth'})}
function showSummary(){let correct=questions.length-wrong.length;let s=byId('summary');s.classList.remove('hidden');s.innerHTML=`<div class="tag">채점 결과</div><div class="score">${correct} / ${questions.length}문제 정답 · ${questions.length?Math.round(correct/questions.length*100):0}점</div><p class="muted">틀린 문제 ${wrong.length}개 · 틀린 문제 아래에서 병음과 뜻을 확인하세요.</p>`}
function previous(){let record=getRecord();if(!record){alert('저장된 이전 결과가 없습니다.');return}let items=record.ids.map(id=>DATA.find(q=>q.id===id)).filter(Boolean);questions=items.map((q,i)=>({...q,choices:Array.isArray(record.choices?.[i])?record.choices[i]:choiceList(q)}));answers=record.answers||{};mode=record.mode+' · 이전 결과';graded=false;render();graded=true;showGrading();byId('submitbox').classList.add('hidden');byId('previous').disabled=false;window.scrollTo(0,0)}
byId('grade').addEventListener('click',grade);byId('restart').addEventListener('click',()=>start());byId('retry').addEventListener('click',()=>{if(!graded||!wrong.length)return;start(DATA.filter(q=>wrong.includes(q.id)),'틀린 문제 다시 풀기')});byId('previous').addEventListener('click',previous);start();
</script></body></html>
